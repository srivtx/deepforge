name: CI

on:
  push:
    branches: [main, surpass-deepml]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.3.9
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: bun test

      - name: Verify learning paths (structure)
        run: bun run scripts/verify-paths.ts

      - name: Verify learning paths (content)
        run: bun run scripts/verify-paths-content.ts

      - name: Verify problem bank (Python 3 harness)
        run: bun run scripts/verify-problems.ts

      - name: Verify alibi bank (Python 3 harness)
        timeout-minutes: 12
        run: bun run scripts/verify-alibis.ts

      - name: Verify behavioral delta ledger (census + harness fixtures)
        timeout-minutes: 8
        run: bun run scripts/verify-bdl.ts

      - name: Verify KeyFuse (probe + witness gate)
        timeout-minutes: 6
        run: bun run scripts/verify-keyfuse.ts

      - name: Verify Warrant (contract + arena gate)
        timeout-minutes: 6
        run: bun run scripts/verify-warrant.ts

      - name: Build
        timeout-minutes: 15
        run: bun run build

      - name: Start production server on :3099
        run: |
          bunx next start -p 3099 > /tmp/next-start.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3099/; then
              ready=1
              echo "server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "server not ready after 60s"
            cat /tmp/next-start.log
            exit 1
          fi

      - name: E2E smoke
        timeout-minutes: 10
        run: bun run scripts/e2e-smoke.mjs
        env:
          BASE_URL: http://localhost:3099

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/next-start.log || true
